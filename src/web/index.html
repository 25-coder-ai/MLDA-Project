<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRUST-CODE · LLM Trust Engine</title>
  <meta name="description" content="Evidence-based verification of AI code reviews and AI-generated patches." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%237c5cff'/%3E%3Cpath d='m11 16 3.5 3.5L21.5 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/workbench" aria-label="TRUST-CODE home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="url(#bm)"/><path d="m11 16 3.5 3.5L21.5 12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text"><b>TRUST<span class="dot">·</span>CODE</b><small>LLM Trust Engine</small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/workbench" data-route="workbench">Workbench</a>
      <a href="#/report" data-route="report">Report</a>
      <a href="#/evidence" data-route="evidence">Evidence</a>
      <a href="#/prove" data-route="prove">Prove</a>
      <a href="#/architecture" data-route="architecture">How it works</a>
    </nav>
    <div class="top-actions">
      <div class="dropdown" id="historyDropdown">
        <button class="icon-btn" id="historyBtn" title="Recent runs" aria-haspopup="true">
          <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5" /></svg>
        </button>
        <div class="dropdown-menu" id="historyMenu"></div>
      </div>
      <button class="status-pill" id="statusPill" title="Engine capabilities"><span class="pulse"></span><span id="statusText">connecting…</span></button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div class="overlay hidden" id="runOverlay" role="dialog" aria-modal="true" aria-labelledby="runTitle">
    <div class="run-card">
      <div class="run-head">
        <div>
          <h2 id="runTitle">Verifying AI output</h2>
          <p class="muted" id="runSub">Gathering ground truth before a single claim is read.</p>
        </div>
        <div class="run-pct" id="runPct">0%</div>
      </div>
      <div class="bar"><div class="bar-fill" id="runBar"></div></div>
      <ol class="stepper" id="runStages"></ol>
      <pre class="run-log" id="runLog"></pre>
    </div>
  </div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg></button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
